name: Update power demand data

on:
  schedule:
    # every 30 minutes (UTC); GitHub may delay scheduled runs by a few minutes
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force_reference:
        description: "Also refresh the yearly reference datasets now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect SLDC data
        run: |
          if [ "${{ inputs.force_reference }}" = "true" ]; then
            python scripts/fetch_data.py --force-reference
          else
            python scripts/fetch_data.py
          fi

      - name: Commit changes
        run: |
          git config user.name  "power-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Data update $(TZ=Asia/Kolkata date '+%d-%m-%Y %H:%M IST')"
            git pull --rebase --autostash || true
            git push
          fi
